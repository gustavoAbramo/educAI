0" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" font-weight="normal"  fill="#fecaca">O navegador bloqueou o acesso. Clique no cadeado da barra de endereço,</text><text x="460" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" font-weight="normal"  fill="#fecaca">permita o microfone e tente de novo.</text><rect x="1215" y="288" width="150" height="46" rx="12" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="2"/><text x="1235" y="318" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="bold"  fill="#111">Tentar de novo</text><text x="1385" y="318" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="normal"  fill="#fca5a5">Como liberar?</text><text x="395" y="450" font-family="Arial, Helvetica, sans-serif" font-size="56" text-anchor="start" font-weight="bold"  fill="#f4f4f5">00:00</text><text x="560" y="445" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" font-weight="normal"  fill="#a1a1aa">Microfone: Padrão do sistema</text><rect x="395" y="480" width="250" height="56" rx="16" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="2"/><text x="440" y="516" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="start" font-weight="bold"  fill="#111">▶  Retomar gravação</text><rect x="665" y="480" width="210" height="56" rx="16" fill="none" stroke="#ef4444" stroke-width="2"/><text x="700" y="516" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="start" font-weight="normal"  fill="#fca5a5">■  Encerrar aula</text><line x1="360" y1="565" x2="2000" y2="565" stroke="#2c2c34" stroke-width="1.6"   /><rect x="414" y="600" width="1040" height="440" rx="14" fill="#121826" stroke="#2c2c34" stroke-width="2"/><text x="440" y="645" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold"  fill="#f4f4f5">Prévia da fala (estimativa do navegador)</text><rect x="1290" y="620" width="150" height="36" rx="18" fill="#1f2937" stroke="#2c2c34" stroke-width="2"/><text x="1310" y="645" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="normal"  fill="#cbd5e1">ⓘ  O que é?</text><rect x="440" y="680" width="990" height="170" rx="14" fill="#18202f" stroke="#2c2c34" stroke-width="2"/><text x="465" y="730" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start" font-weight="normal"  fill="#f4f4f5">Gravação pausada. Clique em "Retomar gravação" para continuar.</text><text x="465" y="770" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" font-weight="normal"  fill="#a1a1aa">O texto aparece aqui enquanto você fala; ele não substitui a transcrição final.</text><text x="1474" y="612" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="start" font-weight="bold"  fill="#f4f4f5">Indicadores da fala</text><rect x="1740" y="586" width="206" height="36" rx="18" fill="#16161b" stroke="#2c2c34" stroke-width="2"/><text x="1758" y="611" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="normal"  fill="#f4f4f5">Falante: Prof. Ana</text><rect x="1474" y="640" width="472" height="104" rx="14" fill="#16161b" stroke="#2c2c34" stroke-width="2"/><text x="1496" y="676" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" font-weight="normal"  fill="#a1a1aa">Confiança do reconhecimento</text><text x="1496" y="716" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="start" font-weight="normal"  fill="#f4f4f5">Aguardando fala</text><text x="1900" y="676" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="start" font-weight="normal"  fill="#a1a1aa">ⓘ</text><rect x="1474" y="760" width="472" height="104" rx="14" fill="#16161b" stroke="#2c2c34" stroke-width="2"/><text x="1496" y="796" font-family="Arial, Helvetica, sans-serif" font-size="18"